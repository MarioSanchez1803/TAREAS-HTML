<form action="" method="get">
    <fieldset>
        <legend>Formulario de Matrícula</legend>
        <label for="Nombre">Nombre</label>
            <input type="text" name="nombre" id="Nombre"><br>
        <label for="Email">Email</label>
            <input type="email" name="email" id="Email"><br>
        <label for="Ciudad">Ciudad</label>
            <select name="Ciudad" id="Ciudad">
                <option value="MALAGA">MÁLAGA</option>
                <option value="GRANADA">GRANADA</option>
                <option value="SEVILLA">SEVILLA</option>
                <option value="HUELVA">HUELVA</option>

                <option value="JAEN">JAÉN</option>
                <option value="ALMERIA">ALMERÍA</option>
                <option value="CADIZ">CÁDIZ</option>
            </select><br>

        <label for="Turno">Turno:</label>
            <input type="radio" name="Turno" id="Turno" value="Mañana">Mañana
            <input type="radio" name="Turno" id="Turno" value="Tarde">Tarde <br>
        <label for="Opciones">Opciones:</label>
            <input type="checkbox" name="Seguro Escolar" id="Opciones">Seguro Escolar <br>
            <input type="checkbox" name="Recibir Notificaciones" id="Opciones">Recibir Notificaciones <br>
        <label for="Comentario">Comentarios:</label><br>
            <textarea name="comentarios" id="Comentario" cols="20" rows="5" placeholder="Deja tu comentario positivo"></textarea><br>
        <input type="submit" value="ENVIAR">
        <input type="reset" value="RESTABLECER">
    </fieldset>
